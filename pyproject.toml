[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zoemzone"
version = "0.1.0"
description = "Starter Python project"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "ZoemZone Team" }
]
dependencies = []

[project.scripts]
zoemzone = "zoemzone.main:run"
zoemzone-shp-gui = "zoemzone.shapefile_export_gui:run"

[tool.pytest.ini_options]
testpaths = ["tests"]
